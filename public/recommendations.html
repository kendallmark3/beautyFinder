<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beauty Advisor · Recommendations</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/recommendations.css" />
</head>
<body>
  <header>
    <h1><a class="brand" href="/">Beauty Advisor</a></h1>
    <nav aria-label="Main"><a href="/">Home</a><a href="/discover.html">Discover</a><a href="/shade-finder.html">Shade Finder</a><a class="bag-link" href="/cart.html">Bag (<span data-bag-count>0</span>)</a></nav>
  </header>

  <main class="recommendations-page">
    <div class="eyebrow">Curated picks</div>
    <h2>Three picks for a simple routine</h2>
    <p class="picks-lede">One product for each step, in the order you would use them: skin prep, base, and colour to finish. Or look at one category.</p>

    <div class="filters" id="recommendation-filters" role="group" aria-label="Show picks for">
      <button type="button" class="active" data-category="all">All</button>
      <button type="button" data-category="foundation">Foundation</button>
      <button type="button" data-category="serum">Serum</button>
      <button type="button" data-category="mascara">Mascara</button>
      <button type="button" data-category="lipstick">Lipstick</button>
    </div>

    <div class="grid" id="recommendations-grid"></div>
  </main>

  <script type="module" src="/recommendations.js"></script>
</body>
</html>
