<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-labelledby="t">
  <title id="t">Three women with lighter, medium and deeper skin</title>
  <defs>
    <g id="face">
      <path d="M-30,0 q10,9 20,0 M10,0 q10,9 20,0" fill="none" stroke="#2a1a14" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M-13,37 q6.500,-6 13,-1 q6.500,-5 13,1 q-13,13 -26,0 Z" fill="#b8434e"/>
    </g>
    <path id="bust" d="M-125,330 C-125,160 -60,116 -22,110 L22,110 C60,116 125,160 125,330 Z"/>
    <path id="neckline" d="M-22,60 L22,60 L24,112 Q0,150 -24,112 Z"/>
  </defs>

  <path d="M40,520 V250 a220,220 0 0 1 440,0 V520 Z" fill="#e8bfa9"/>
  <circle cx="412" cy="92" r="34" fill="#c9a36a" opacity=".55"/>
  <circle cx="92" cy="130" r="10" fill="#c9a36a" opacity=".55"/>

  <!-- lighter skin, long straight hair -->
  <g transform="translate(138,262) scale(.86)">
    <path d="M-72,-10 C-82,-104 82,-104 72,-10 L84,170 Q0,190 -84,170 Z" fill="#6b3f2a"/>
    <use href="#bust" fill="#f6efe6"/>
    <use href="#neckline" fill="hsl(26, 42%, 76%)"/>
    <ellipse rx="56" ry="70" fill="hsl(26, 42%, 81%)"/>
    <path d="M-58,-8 C-62,-84 62,-84 58,-8 C40,-52 -6,-62 -58,-8 Z" fill="#6b3f2a"/>
    <use href="#face"/>
  </g>

  <!-- deeper skin, natural curls -->
  <g transform="translate(386,262) scale(.86)">
    <circle cy="-34" r="98" fill="#1d1412"/>
    <circle cx="-78" cy="-70" r="34" fill="#1d1412"/>
    <circle cx="78" cy="-70" r="34" fill="#1d1412"/>
    <circle cx="-92" cy="-8" r="30" fill="#1d1412"/>
    <circle cx="92" cy="-8" r="30" fill="#1d1412"/>
    <circle cy="-118" r="36" fill="#1d1412"/>
    <use href="#bust" fill="#c9a36a"/>
    <use href="#neckline" fill="hsl(18, 38%, 25%)"/>
    <ellipse rx="56" ry="70" fill="hsl(18, 38%, 29%)"/>
    <path d="M-57,-10 C-60,-80 60,-80 57,-10 C40,-46 -40,-46 -57,-10 Z" fill="#1d1412"/>
    <use href="#face"/>
  </g>

  <!-- medium skin, hair in a bun -->
  <g transform="translate(262,292) scale(1.08)">
    <circle cy="-100" r="32" fill="#2b1a14"/>
    <use href="#bust" fill="#111"/>
    <use href="#neckline" fill="hsl(32, 52%, 50%)"/>
    <ellipse rx="56" ry="70" fill="hsl(32, 52%, 55%)"/>
    <path d="M-58,-6 C-64,-86 64,-86 58,-6 C44,-50 -44,-50 -58,-6 Z" fill="#2b1a14"/>
    <use href="#face"/>
    <circle cx="-58" cy="26" r="5" fill="#c9a36a"/>
    <circle cx="58" cy="26" r="5" fill="#c9a36a"/>
  </g>
</svg>
