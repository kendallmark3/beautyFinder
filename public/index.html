<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beauty Advisor · Catalog</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>Beauty Advisor</h1>
    <nav><a href="/">Catalog</a><a id="shade-link" href="/shade-finder.html" hidden>Shade Finder</a></nav>
  </header>
  <section class="hero">
    <div class="hero-inner">
      <div class="hero-copy">
        <div class="eyebrow">Your beauty finder</div>
        <h2>Find the foundation shade that matches you.</h2>
        <p>Tell us your skin depth and undertone, and see your three closest shades, lighter to deeper.</p>
        <a class="cta" href="/shade-finder.html">Find my shade</a>
        <a class="quiet-link" href="#collection">Shop the collection</a>
        <div class="swatches" id="hero-shades" aria-hidden="true"></div>
      </div>
      <div class="hero-art">
        <img src="/hero.svg" alt="Illustration of three women with lighter, medium and deeper skin" />
      </div>
    </div>
  </section>
  <main id="collection">
    <div class="eyebrow">Feature 001 · Product Catalog</div>
    <h2>Shop the collection</h2>
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
  </main>
  <script type="module">
    import { shadeColor } from '/shade-color.js';
    const cats = ['all', 'foundation', 'serum', 'mascara', 'lipstick'];
    const filters = document.getElementById('filters');
    const grid = document.getElementById('grid');

    async function load(cat) {
      const q = cat === 'all' ? '' : `?category=${cat}`;
      const { products } = await (await fetch(`/api/products${q}`)).json();
      [...filters.children].forEach((b) => b.classList.toggle('active', b.dataset.cat === cat));
      grid.innerHTML = '';
      for (const p of products) {
        const el = document.createElement('div');
        el.className = 'card';
        el.innerHTML = `<div class="cat">${p.category}</div><h3>${p.name}</h3><p>${p.description}</p>`;
        if (p.shades) {
          const sw = document.createElement('div');
          sw.className = 'swatches';
          p.shades.forEach((s) => {
            const d = document.createElement('span');
            d.className = 'swatch'; d.title = s.name; d.style.background = shadeColor(s.depth, s.undertone);
            sw.appendChild(d);
          });
          el.appendChild(sw);
        }
        grid.appendChild(el);
      }
    }
    cats.forEach((c) => {
      const b = document.createElement('button');
      b.textContent = c; b.dataset.cat = c; b.onclick = () => load(c);
      filters.appendChild(b);
    });
    load('all');
    // Hero: one swatch per foundation shade, lighter to deeper.
    fetch('/api/products?category=foundation').then((r) => r.json()).then(({ products }) => {
      const row = document.getElementById('hero-shades');
      products.flatMap((p) => p.shades || []).sort((a, b) => a.depth - b.depth).forEach((s) => {
        const d = document.createElement('span');
        d.className = 'swatch'; d.style.background = shadeColor(s.depth, s.undertone);
        row.appendChild(d);
      });
    });
    // Shade Finder link appears once Feature 002 is built.
    fetch('/shade-finder.html', { method: 'HEAD' }).then((r) => { if (r.ok) document.getElementById('shade-link').hidden = false; });
  </script>
</body>
</html>
